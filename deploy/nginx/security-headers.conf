# Installed by scripts/deploy-host-nginx.sh as
# /etc/nginx/snippets/nosrati-security-headers.conf — prefixed so it cannot
# clash with another project's snippet on a shared host.

add_header X-Frame-Options            "SAMEORIGIN" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

# The app is self-contained apart from the Vazirmatn webfont, which is loaded
# from Google Fonts. 'unsafe-inline' is required because the page's CSS and
# JS are inline in index.html by design (single-file frontend).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
